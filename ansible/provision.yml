---
# One-off host provisioning: gets a fresh Ubuntu/Debian box ready to run the
# dispenser-platform container. Run once per host before "deploy.yml".
- name: Provision dispenser-platform host
  hosts: dispenser_hosts
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create dedicated deploy user for the app
      ansible.builtin.user:
        name: dispenser-app
        groups: docker
        append: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/dispenser-platform
        state: directory
        owner: dispenser-app
        group: dispenser-app
        mode: "0750"

    - name: Open application port in ufw
      community.general.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp
      when: ansible_facts['os_family'] == "Debian"
